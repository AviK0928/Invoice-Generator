spring:
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false

    # Migrations run against the container, so the schema under test is the one
    # that ships. A separate test schema would defeat the point of validate.
    flyway:
        enabled: true
        clean-disabled: false

    kafka:
        # Overridden by the @TestPropertySource on IntegrationTest, which points
        # at the embedded broker. The default is a placeholder for anything that
        # somehow runs outside that base class.
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: invoice-service-test
            auto-offset-reset: earliest
        admin:
            # The unit is mandatory. operationTimeout binds as a Duration with
            # no @DurationUnit, so a bare "5" is five MILLISECONDS — every
            # describeTopics times out and logs "Could not configure topics"
            # against a broker that is up and reachable.
            fail-fast: false
            operation-timeout: 10s

# The dispatcher is invoked directly by OutboxDispatcherIT. It must not also run
# on a schedule: Spring caches one context for the whole run, so a background
# dispatcher polls the same database every other test asserts on and wins races
# against them. An hour is "never" for a test run without special-casing
# @Scheduled.
outbox:
    poll-interval-ms: 3600000
    batch-size: 100
    # Production default. Nothing here retries — a send that fails in a test is
    # a failure, not something to sit through a backoff for.
    max-attempts: 3
    cleanup-cron: "-"

# Never run during tests.
invoice:
    auto-archive-cron: "-"

# Cron disabled; the sweep is invoked directly. A background job writing to the
# table these tests assert on is the race the outbox dispatcher already taught
# us to avoid.
pdf:
    request-timeout-minutes: 15
    sweep-cron: "-"

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

logging:
    level:
        root: WARN
        com.example.invoice: INFO
        # The embedded broker and its clients are chatty at INFO and silent at
        # WARN unless something is actually wrong. These were pinned to ERROR
        # while the broker was unreachable by design, which also hid genuine
        # failures; there is no longer a reason to hide them.
        kafka: WARN
        org.apache.kafka: WARN
        org.springframework.kafka: WARN
        # Broker-internal state churn on startup. Noise, not diagnostics.
        state.change.logger: ERROR
