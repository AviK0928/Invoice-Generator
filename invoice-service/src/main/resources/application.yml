server:
  port: ${PORT:8082}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: invoice-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoicedb}
    username: ${DB_USER:invoice}
    password: ${DB_PASS:invoice}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000

  # Flyway owns the schema. Hibernate only checks that the entities match what
  # the migrations produced, and fails startup if they diverge.
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: invoice-service-group
      auto-offset-reset: earliest

# The spec path is prefixed with this service's API namespace so the gateway's
# existing /api/invoices/** route carries it unchanged. Without the prefix the
# gateway would need a dedicated route per service just for documentation.
springdoc:
  api-docs:
    enabled: true
    path: /api/invoices/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.invoice: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.example.invoice: DEBUG

---
# Documentation is a development and demo aid. On a public deployment it
# advertises every endpoint and payload shape to anyone who finds the URL.
# Disabled by default in the cloud profile; flip SPRINGDOC_ENABLED to true when
# the deployed API is meant to be browsable.
spring:
  config:
    activate:
      on-profile: cloud
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
