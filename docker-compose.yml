name: invoice-generator

# Shared health check. $$PORT escapes to a literal $PORT so the container's
# own shell expands it — each service sets PORT in its environment below.
x-health: &health
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/actuator/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s

x-app: &app
  restart: unless-stopped
  mem_limit: 512m
  build: &build
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DB_USER: ${POSTGRES_USER:-invoice}
    DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  healthcheck: *health
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker sizing. The default __consumer_offsets topic has 50
      # partitions, which thrashes coordinator election on 2 cores and causes
      # the NOT_COORDINATOR retry storm.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Turn off once topics are declared as NewTopic beans (Phase 3).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  customer-service:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: customer-service
    environment:
      <<: *app-env
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/customerdb

  invoice-service:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: invoice-service
    environment:
      <<: *app-env
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/invoicedb

  export-service:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: export-service
    environment:
      <<: *app-env
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/exportdb

  import-service:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: import-service
    environment:
      <<: *app-env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/importdb

  archive-service:
    <<: *app
    build:
      <<: *build
      args:
        SERVICE: archive-service
    environment:
      <<: *app-env
      PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/archivedb

  api-gateway:
    restart: unless-stopped
    mem_limit: 512m
    build:
      <<: *build
      args:
        SERVICE: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8080
      CUSTOMER_SERVICE_URI: http://customer-service:8081
      INVOICE_SERVICE_URI: http://invoice-service:8082
      EXPORT_SERVICE_URI: http://export-service:8083
      IMPORT_SERVICE_URI: http://import-service:8084
      ARCHIVE_SERVICE_URI: http://archive-service:8085
    healthcheck: *health
    depends_on:
      customer-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      export-service:
        condition: service_healthy
      import-service:
        condition: service_healthy
      archive-service:
        condition: service_healthy

volumes:
  pgdata: