version: '2.4'

services:
  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    restart: always
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper

  postgres-customer:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata-customer:/var/lib/postgresql/data

  postgres-invoice:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: invoicedb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata-invoice:/var/lib/postgresql/data

  postgres-export:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: exportdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - pgdata-export:/var/lib/postgresql/data

  postgres-import:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: importdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - pgdata-import:/var/lib/postgresql/data

  postgres-archive:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: archivedb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - pgdata-archive:/var/lib/postgresql/data

  customer-service:
    image: customer-service:latest
    build:
      context: ./customer-service
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres-customer

  invoice-service:
    image: invoice-service:latest
    build:
      context: ./invoice-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - postgres-invoice

  export-service:
    image: export-service:latest
    build:
      context: ./export-service
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres-export

  import-service:
    image: import-service:latest
    build:
      context: ./import-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - postgres-import

  archive-service:
    image: archive-service:latest
    build:
      context: ./archive-service
    ports:
      - "8085:8085"
    depends_on:
      - kafka
      - postgres-archive

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - customer-service
      - invoice-service
      - export-service
      - import-service
      - archive-service

volumes:
  pgdata-customer:
  pgdata-invoice:
  pgdata-export:
  pgdata-import:
  pgdata-archive: