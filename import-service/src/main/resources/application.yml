server:
  port: ${PORT:8084}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: import-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/importdb}
    username: ${DB_USER:invoice}
    password: ${DB_PASS:invoice}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000

  # Flyway owns the schema. Hibernate only checks that the entities match what
  # the migrations produced, and fails startup if they diverge.
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: import-service-group
      auto-offset-reset: earliest

  # Bounds the upload. Without these, a large CSV is read into heap and kills a
  # 512MB instance. file-size-threshold spools anything over 1MB to a temp file
  # that Tomcat deletes when the request ends — the one place a temp file is
  # fine, because the container owns its lifecycle.
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}
      file-size-threshold: 1MB

# Rejected past this many rows during parsing, before anything is persisted.
# Sits below the byte limit above so a small file of many tiny rows is still
# caught.
import:
  max-rows: ${IMPORT_MAX_ROWS:10000}

# The spec path is prefixed with this service's API namespace so the gateway's
# existing /api/imports/** route carries it unchanged. Without the prefix the
# gateway would need a dedicated route per service just for documentation.
springdoc:
  api-docs:
    enabled: true
    path: /api/imports/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  default-produces-media-type: application/json

# poll-interval is the best-case delivery latency. max-attempts must exceed
# realistic outage duration — at 10 attempts events were abandoned 20 seconds
# into a broker restart, less than the restart takes.
outbox:
  poll-interval-ms: ${OUTBOX_POLL_MS:2000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:300}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.invoice: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
logging:
  level:
    com.example.invoice: DEBUG

---
# Documentation is a development and demo aid. On a public deployment it
# advertises every endpoint and payload shape to anyone who finds the URL.
# Disabled by default in the cloud profile; flip SPRINGDOC_ENABLED to true when
# the deployed API is meant to be browsable.
spring:
  config:
    activate:
      on-profile: cloud
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
