server:
  port: ${PORT:8084}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: import-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/importdb}
    username: ${DB_USER:invoice}
    password: ${DB_PASS:invoice}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: import-service-group
      auto-offset-reset: earliest

  # Bounds the upload. Without these, a large CSV is read into heap and kills a
  # 512MB instance. file-size-threshold spools anything over 1MB to a temp file
  # that Tomcat deletes when the request ends — the one place a temp file is
  # fine, because the container owns its lifecycle.
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}
      file-size-threshold: 1MB

# Rejected past this many rows during parsing, before anything is persisted.
# Sits below the byte limit above so a small file of many tiny rows is still
# caught.
import:
  max-rows: ${IMPORT_MAX_ROWS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.invoice: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
logging:
  level:
    com.example.invoice: DEBUG
