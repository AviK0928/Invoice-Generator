server:
  port: ${PORT:8083}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: export-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exportdb}
    username: ${DB_USER:invoice}
    password: ${DB_PASS:invoice}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000

  # Flyway owns the schema. Hibernate only checks that the entities match what
  # the migrations produced, and fails startup if they diverge.
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: export-service-group
      auto-offset-reset: earliest

# Monthly archives are assembled in memory inside a read-only transaction —
# StreamingResponseBody writes after the transaction closes, which fails with
# open-in-view disabled. This bounds worst-case heap on a 512MB instance;
# exceeding it returns 413 rather than an OOM.
export:
  max-invoices: ${EXPORT_MAX_INVOICES:500}

# The spec path is prefixed with this service's API namespace so the gateway's
# existing /api/exports/** route carries it unchanged.
springdoc:
  api-docs:
    enabled: true
    path: /api/exports/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  default-produces-media-type: application/json

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.invoice: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
logging:
  level:
    com.example.invoice: DEBUG

---
# Documentation is a development and demo aid. On a public deployment it
# advertises every endpoint and payload shape to anyone who finds the URL.
spring:
  config:
    activate:
      on-profile: cloud
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
