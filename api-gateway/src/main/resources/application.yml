server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # Each route also carries that service's /v3/api-docs, because the spec
        # paths are prefixed with the same namespace. No separate doc routes.
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/customers/**

        - id: invoice-service
          uri: ${INVOICE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/invoices/**

        - id: export-service
          uri: ${EXPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/exports/**

        - id: import-service
          uri: ${IMPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/imports/**

        - id: archive-service
          uri: ${ARCHIVE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/archives/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST

# The gateway has no endpoints of its own, so it serves no spec — it only hosts
# the UI, with a dropdown that fetches each service's spec through the routes
# above. One page to browse the whole API.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    display-request-duration: true
    urls:
      - name: customer-service
        url: /api/customers/v3/api-docs
      - name: invoice-service
        url: /api/invoices/v3/api-docs
      - name: export-service
        url: /api/exports/v3/api-docs
      - name: import-service
        url: /api/imports/v3/api-docs
      - name: archive-service
        url: /api/archives/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
server:
  error:
    include-stacktrace: on_param
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

---
spring:
  config:
    activate:
      on-profile: cloud
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
