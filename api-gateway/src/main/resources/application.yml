server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # /api/auth/** matches no route here, so it falls through to the
        # gateway's own AuthController rather than being proxied anywhere.
        #
        # Each route also carries that service's /v3/api-docs, because the spec
        # paths are prefixed with the same namespace. No separate doc routes.
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/customers/**

        - id: invoice-service
          uri: ${INVOICE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/invoices/**

        - id: export-service
          uri: ${EXPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/exports/**

        - id: import-service
          uri: ${IMPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/imports/**

        - id: archive-service
          uri: ${ARCHIVE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/archives/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST

# HS256, symmetric: the gateway is both issuer and verifier, so there is no
# third party needing a public key. Generate with: openssl rand -base64 48
# The local default exists so the gateway starts without a .env; it must be
# overridden anywhere that matters.
jwt:
  secret: ${JWT_SECRET:local-development-only-secret-at-least-32-bytes-long-change-me}

# Users live in configuration; there is no user service, and adding one to
# demonstrate JWT would be scope creep. Passwords are bcrypt hashes — plaintext
# never appears here or in the repository.
#
# Demo credentials are documented in the README. Regenerate a hash with:
#   docker run --rm httpd:alpine htpasswd -bnBC 10 "" yourpassword | tr -d ':\n'
auth:
  token-ttl-minutes: ${JWT_TTL_MINUTES:60}
  users:
    admin:
      password-hash: ${ADMIN_PASSWORD_HASH}
      roles: [ADMIN, USER]
    user:
      password-hash: ${USER_PASSWORD_HASH}
      roles: [USER]

# The gateway owns one endpoint (/api/auth/login), so it does serve a small spec
# of its own at /gateway/v3/api-docs — under /gateway rather than /api so it
# does not collide with the proxy routes. api-docs must stay enabled: springdoc's
# WebFlux UI auto-configuration is conditional on it, so disabling the spec takes
# the UI down with it.
springdoc:
  api-docs:
    enabled: true
    path: /gateway/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    display-request-duration: true
    urls:
      - name: customer-service
        url: /api/customers/v3/api-docs
      - name: invoice-service
        url: /api/invoices/v3/api-docs
      - name: export-service
        url: /api/exports/v3/api-docs
      - name: import-service
        url: /api/imports/v3/api-docs
      - name: archive-service
        url: /api/archives/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
    # Logs failed logins and token rejections without logging the tokens.
    com.example.invoice.api_gateway: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: dev
server:
  error:
    include-stacktrace: on_param
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: cloud
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
# No default for the secret in the cloud profile: the gateway must fail to start
# rather than run with a known key. Set JWT_SECRET in Render's environment.
jwt:
  secret: ${JWT_SECRET}
