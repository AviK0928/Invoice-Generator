server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/customers/**

        - id: invoice-service
          uri: ${INVOICE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/invoices/**

        - id: export-service
          uri: ${EXPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/exports/**

        - id: import-service
          uri: ${IMPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/imports/**

        - id: archive-service
          uri: ${ARCHIVE_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/archives/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
