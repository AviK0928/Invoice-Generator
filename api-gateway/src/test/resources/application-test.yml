# Overrides the placeholders in application.yml that have no defaults —
# ADMIN_PASSWORD_HASH and USER_PASSWORD_HASH — so the context starts without
# a .env. Spring resolves a placeholder only if no higher-precedence source
# supplies the key, so those env vars are never looked up here.
jwt:
    secret: test-only-secret-at-least-32-bytes-long-for-hs256-signing

auth:
    token-ttl-minutes: 60
    users:
        admin:
            # bcrypt cost 10 of "test-password". Both users share the password;
            # only the roles differ, which is what these tests care about.
            password-hash: "$2b$10$gEVIhuWm4QhkKTQmrTrrFOrhJraFkmp/LVHv0hbCGVSkDH4oJyCbm"
            roles: [ADMIN, USER]
        user:
            password-hash: "$2b$10$gEVIhuWm4QhkKTQmrTrrFOrhJraFkmp/LVHv0hbCGVSkDH4oJyCbm"
            roles: [USER]

logging:
    level:
        root: WARN
        com.example.invoice: INFO
